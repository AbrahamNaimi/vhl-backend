spring:
  application:
    name: vhl-site
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vhl}
    username: ${DATABASE_USERNAME:vhl}
    password: ${DATABASE_PASSWORD:vhl}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true