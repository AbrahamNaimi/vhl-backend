services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: vhl
      POSTGRES_USER: vhl
      POSTGRES_PASSWORD: vhl
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vhl -d vhl"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data: